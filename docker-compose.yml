services:
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    container_name: blog-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"

  backend:
    build:
      context: ./blog_backend
    container_name: blog-backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
    ports:
      - "8001:8000"
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis
      - kafka

  frontend:
    build:
      context: ./blog-frontend
      args:
        VITE_API_URL: http://localhost:8001
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  blog_backend_data:
