services:
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./blog_backend
    container_name: blog-auth-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    ports:
      - "8003:8000"
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis

  content-service:
    build:
      context: ./blog_backend
    container_name: blog-content-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    command: ["uvicorn", "app.service_apps.content_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis

  analytics-service:
    build:
      context: ./blog_backend
    container_name: blog-analytics-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
      TIMELINE_EVENTS_ENABLED: "false"
      TIMELINE_CACHE_ENABLED: "false"
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    command: ["uvicorn", "app.service_apps.analytics_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis

  timeline-service:
    build:
      context: ./blog_backend
    container_name: blog-timeline-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    command: ["uvicorn", "app.service_apps.timeline_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis

  admin-service:
    build:
      context: ./blog_backend
    container_name: blog-admin-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      ML_DATABASE_URL: sqlite+aiosqlite:///./data/ml_training.db
      SECRET_KEY: changeme
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TIMELINE_TOPIC: timeline-events
      TIMELINE_EVENTS_ENABLED: "false"
      TIMELINE_CACHE_ENABLED: "false"
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    command: ["uvicorn", "app.service_apps.admin_app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - redis

  api-gateway:
    image: nginx:1.27-alpine
    container_name: blog-api-gateway
    depends_on:
      - auth-service
      - content-service
      - timeline-service
      - admin-service
    volumes:
      - ./blog_backend/nginx.gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8002:80"

  frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8002
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: blog-frontend
    environment:
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

  seed-service:
    build:
      context: ./blog_backend
    container_name: blog-seed-service
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/blog.db
      WELCOME_DB_PATH: /app/data/blog.db
      WELCOME_ADMIN_PASSWORD: ${WELCOME_ADMIN_PASSWORD:-AdminWelcome123!}
    command: ["sh", "-c", "sleep 5 && python populate_welcome_posts_direct.py"]
    volumes:
      - blog_backend_data:/app/data
    depends_on:
      - auth-service
      - content-service
      - timeline-service

volumes:
  blog_backend_data:
