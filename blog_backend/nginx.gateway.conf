events {}

http {
  upstream auth_service {
    server auth-service:8000;
  }

  upstream content_service {
    server content-service:8000;
  }

  upstream analytics_service {
    server analytics-service:8000;
  }

  upstream timeline_service {
    server timeline-service:8000;
  }

  upstream admin_service {
    server admin-service:8000;
  }

  server {
    listen 80;

    location /api/users/ {
      proxy_pass http://auth_service;
    }

    location /api/profile/ {
      proxy_pass http://auth_service;
    }

    location /api/follows/ {
      proxy_pass http://auth_service;
    }

    location /api/posts/ {
      proxy_pass http://content_service;
    }

    location /api/moderation/ {
      proxy_pass http://content_service;
    }

    location /api/analytics/ {
      proxy_pass http://analytics_service;
    }

    location /api/timeline/ {
      proxy_pass http://timeline_service;
    }

    location /ws/timeline {
      proxy_pass http://timeline_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /api/admin/ {
      proxy_pass http://admin_service;
    }

    location /api/ml/ {
      proxy_pass http://admin_service;
    }

    location / {
      return 200 '{"service":"api-gateway","message":"Blog backend gateway"}';
      add_header Content-Type application/json;
    }
  }
}
