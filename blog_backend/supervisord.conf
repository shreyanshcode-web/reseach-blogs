[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server
autostart=true
autorestart=true
priority=1

[program:auth_service]
command=uvicorn app.service_apps.auth_app:app --host 127.0.0.1 --port 8003
directory=/app
autostart=true
autorestart=true
priority=10

[program:content_service]
command=uvicorn app.service_apps.content_app:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
priority=10

[program:analytics_service]
command=uvicorn app.service_apps.analytics_app:app --host 127.0.0.1 --port 8004
directory=/app
autostart=true
autorestart=true
priority=10

[program:timeline_service]
command=uvicorn app.service_apps.timeline_app:app --host 127.0.0.1 --port 8005
directory=/app
autostart=true
autorestart=true
priority=10

[program:admin_service]
command=uvicorn app.service_apps.admin_app:app --host 127.0.0.1 --port 8006
directory=/app
autostart=true
autorestart=true
priority=10

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=20
